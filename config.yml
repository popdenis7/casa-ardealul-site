backend:
  name: git-gateway
  branch: main

media_folder: "content/images"
public_folder: "/content/images"

publish_mode: simple

locale: "ro"

collections:
  - name: "settings"
    label: "Site — Casa Ardealul"
    files:
      - name: "main"
        label: "Conținut site"
        file: "content/settings.json"
        fields:
          - { label: "Nume afacere", name: "business_name", widget: "string" }
          - { label: "Subtitlu mic (deasupra titlului)", name: "eyebrow", widget: "string" }
          - { label: "Titlu principal — rândul 1", name: "hero_title_line1", widget: "string" }
          - { label: "Titlu principal — rândul 2", name: "hero_title_line2", widget: "string" }
          - { label: "Titlu principal — cuvânt evidențiat", name: "hero_title_em", widget: "string" }
          - { label: "Text descriere (sub titlu)", name: "hero_sub", widget: "text" }
          - { label: "Adresă", name: "address", widget: "string" }
          - { label: "Program", name: "hours", widget: "string" }
          - { label: "Telefon", name: "phone", widget: "string" }
          - { label: "Poză principală (hero)", name: "hero_image", widget: "image", required: false }

          - label: "Repere (etichete evidențiate)"
            name: "highlights"
            widget: "list"
            field: { label: "Reper", name: "item", widget: "string" }

          - label: "Momente ale zilei"
            name: "moments"
            widget: "list"
            fields:
              - { label: "Titlu", name: "title", widget: "string" }
              - { label: "Descriere", name: "desc", widget: "text" }
              - { label: "Poză", name: "image", widget: "image", required: false }

          - label: "Ambianță — paragrafe"
            name: "ambiance_paragraphs"
            widget: "list"
            field: { label: "Paragraf", name: "item", widget: "text" }

          - label: "Ambianță — etichete"
            name: "ambiance_tags"
            widget: "list"
            field: { label: "Etichetă", name: "item", widget: "string" }

          - label: "Informații practice"
            name: "info_rows"
            widget: "list"
            fields:
              - { label: "Titlu (ex: Parcare)", name: "k", widget: "string" }
              - { label: "Detaliu", name: "v", widget: "string" }

          - label: "Oferte (bar & bucătărie)"
            name: "offers"
            widget: "list"
            field: { label: "Ofertă", name: "item", widget: "string" }

          - label: "Galerie foto"
            name: "gallery"
            widget: "list"
            fields:
              - { label: "Descriere", name: "caption", widget: "string" }
              - { label: "Poză", name: "image", widget: "image", required: false }

          - { label: "Footer — text rândul 1", name: "footer_tagline_line1", widget: "string" }
          - { label: "Footer — text rândul 2", name: "footer_tagline_line2", widget: "string" }
          - { label: "Footer — servicii", name: "footer_services", widget: "string" }
